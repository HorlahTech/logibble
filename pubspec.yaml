name: logibble
description: >-
  Logibble is a draggable in-app debug bubble for Flutter. Inspect Dio network traffic
  (headers, bodies, timings, cURL) and local storage without leaving the app.
version: 0.1.0
homepage: https://github.com/HorlahTech/logibble
repository: https://github.com/HorlahTech/logibble
issue_tracker: https://github.com/HorlahTech/logibble/issues
topics:
  - debugging
  - network
  - dio
  - inspector
  - devtools

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
